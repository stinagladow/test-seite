<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Textbezogen erörtern üben – Handyverbot an Schulen</title><style>:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1d2433; --muted:#5b6475; --line:#e2e5eb;
  --accent:#1f5fa8; --accent-soft:#e8f0fb;
  --basis:#2e8b57; --basis-soft:#e6f4ec;
  --standard:#1f5fa8; --standard-soft:#e8f0fb;
  --experte:#6b45b5; --experte-soft:#f0ebfa;
  --warn:#b4541a; --warn-soft:#fdf0e6; --ok:#2e8b57; --ok-soft:#e6f4ec; --bad:#b3261e; --bad-soft:#fbeaea;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;align-self:start}
.side h1{font-size:17px;margin:0 0 4px;line-height:1.3}
.side .sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.levelpill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;color:#fff;margin-bottom:12px}
.lv-basis{background:var(--basis)} .lv-standard{background:var(--standard)} .lv-experte{background:var(--experte)}
.nav{list-style:none;margin:0;padding:0}
.nav li{margin:2px 0}
.nav button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--ink);display:flex;gap:8px;align-items:flex-start}
.nav button:hover{background:var(--bg)}
.nav button.cur{background:var(--accent-soft);font-weight:600}
.nav button:disabled{opacity:.45;cursor:not-allowed}
.nav .dot{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.nav .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 10px 4px}
.progress{height:6px;background:var(--line);border-radius:99px;margin:6px 0 16px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}
.side .small{font-size:13px;margin-top:18px;color:var(--muted)}
.side .small button{background:none;border:0;color:var(--accent);padding:0;text-decoration:underline;font-size:13px}
/* main */
main{padding:28px 36px 80px;max-width:900px;width:100%}
.steptag{font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
main h2{font-size:26px;margin:4px 0 6px;line-height:1.25}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:14px 0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:6px 0}
.card ul,.card ol{margin:6px 0;padding-left:22px}
.task{border-left:5px solid var(--accent)}
.task h3::before{content:"Aufgabe  ";color:var(--accent)}
/* level-specific boxes */
.lvbox{border-radius:var(--radius);padding:14px 18px;margin:14px 0;border:1px solid}
.lvbox.basis{background:var(--basis-soft);border-color:#bfe1cc}
.lvbox.standard{background:var(--standard-soft);border-color:#c5d8f1}
.lvbox.experte{background:var(--experte-soft);border-color:#d8cdf0}
.lvbox .tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.lvbox.basis .tag{color:var(--basis)} .lvbox.standard .tag{color:var(--standard)} .lvbox.experte .tag{color:var(--experte)}
/* help */
details.help{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:12px 0;overflow:hidden}
details.help>summary{cursor:pointer;padding:12px 18px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.help>summary::-webkit-details-marker{display:none}
details.help>summary::before{content:"▸";transition:transform .2s;color:var(--muted)}
details.help[open]>summary::before{transform:rotate(90deg)}
details.help .body{padding:0 18px 14px}
details.help.muster>summary{color:#7a5a00} details.help.muster{border-left:5px solid #e0b400}
details.help.tipp>summary{color:var(--warn)} details.help.tipp{border-left:5px solid var(--warn)}
details.help.formul>summary{color:var(--accent)} details.help.formul{border-left:5px solid var(--accent)}
details.help.loesung>summary{color:var(--ok)} details.help.loesung{border-left:5px solid var(--ok)}
.muster-text{background:#fffbea;border-radius:8px;padding:12px 14px;font-family:Georgia,"Times New Roman",serif;font-size:16.5px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--accent-soft);border:1px solid #c5d8f1;border-radius:99px;padding:4px 12px;font-size:14.5px;cursor:pointer}
.chip:hover{background:#d7e6f8}
.chip.static{cursor:default}
/* checklist */
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.checklist label:last-child{border-bottom:0}
.checklist input{margin-top:5px;width:18px;height:18px;flex:0 0 18px}
.checklist .count{font-size:13px;color:var(--muted);margin-top:6px}
/* write */
.write label.lbl{font-weight:600;display:block;margin-bottom:6px}
textarea,input[type=text],select{width:100%;font:inherit;border:1px solid #cfd4dc;border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-size:15px}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.small{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wc{font-size:13px;color:var(--muted);margin-left:auto}
.result{margin-top:10px;border-radius:8px;padding:10px 14px;font-size:15px}
.result.ok{background:var(--ok-soft);color:#1d5c39}
.result.warn{background:var(--warn-soft);color:#7a3a10}
.result.bad{background:var(--bad-soft);color:var(--bad)}
.result ul{margin:4px 0;padding-left:20px}
mark.hl{background:#ffe08a;border-radius:3px;padding:0 2px}
/* builder */
.builder{display:grid;gap:10px}
.builder .bf label{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.builder .bf .num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.builder textarea{min-height:64px}
.builder .hint{font-size:13.5px;color:var(--muted);margin:2px 0 4px}
/* mc */
.mc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.mc label:hover{background:var(--bg)}
.mc input{margin-top:5px}
/* footer nav */
.stepnav{display:flex;justify-content:space-between;margin-top:28px;gap:10px}
/* level choice */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.lvcard{border:2px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff;text-align:left}
.lvcard:hover{border-color:#b9c2cf}
.lvcard.sel.basis{border-color:var(--basis);background:var(--basis-soft)}
.lvcard.sel.standard{border-color:var(--standard);background:var(--standard-soft)}
.lvcard.sel.experte{border-color:var(--experte);background:var(--experte-soft)}
.lvcard b{display:block;font-size:17px;margin-bottom:4px}
.lvcard.basis b{color:var(--basis)} .lvcard.standard b{color:var(--standard)} .lvcard.experte b{color:var(--experte)}
.lvcard span{font-size:14.5px;color:var(--muted)}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
table.t th,table.t td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--bg)}
/* source text drawer */
.textbtn{position:fixed;right:20px;top:16px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:99px;padding:12px 18px}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,.15);z-index:30;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .scroll{overflow:auto;padding:16px 18px 40px}
.src h4{margin:0 0 2px;font-size:19px;font-family:Georgia,serif}
.src .meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.src .ln{display:grid;grid-template-columns:34px 1fr;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6}
.src .ln i{font-style:normal;color:#9aa3b2;font-family:system-ui,sans-serif;font-size:12px;text-align:right;padding-right:10px;padding-top:3px}
.src .ln.pstart{margin-top:8px}
/* sorter */
.sorter{display:grid;gap:8px}
.scard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.scard .opts{display:flex;gap:6px}
.scard .opts button{border:1px solid #cfd4dc;background:#fff;border-radius:8px;padding:5px 10px;font-size:14px}
.scard .opts button.on.pro{background:var(--ok-soft);border-color:var(--ok);color:#1d5c39;font-weight:600}
.scard .opts button.on.kontra{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.scard.right{border-color:var(--ok)} .scard.wrong{border-color:var(--bad)}
.hourglass{display:grid;grid-template-columns:1fr;gap:10px}
.hg-block{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.hg-block h4{margin:0 0 8px;font-size:15px}
.hg-block .sel{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:6px 0;font-size:14.5px}
.final-preview{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;font-family:Georgia,"Times New Roman",serif;font-size:16.5px;white-space:pre-wrap}
.final-preview h4{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 4px}
.final-preview h4:first-child{margin-top:0}
.empty{color:#a0a7b4;font-style:italic}
.menu-toggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side.collapsed .nav,.side.collapsed .small{display:none}
  .menu-toggle{display:inline-block;margin-bottom:8px}
  main{padding:20px 16px 90px}
  .levels{grid-template-columns:1fr}
}
@media print{
  .side,.stepnav,.textbtn,.drawer,.noprint,.lead,.steptag,main>h2,.stephead,.hero,.finish{display:none!important}
  body{background:#fff}
  .app{display:block}
  main{padding:0;max-width:none}
  .final-preview{border:0;padding:0}
}

/* ================= THEMES ================= */
.card{box-shadow:0 1px 2px rgba(20,30,60,.04),0 4px 14px rgba(20,30,60,.05);border-radius:16px}
details.help{border-radius:14px}
.btn{border-radius:10px;font-weight:600;transition:transform .08s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.task{border-left:0;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--accent),var(--accent2))}
.task h3::before{color:var(--accent)}
/* sidebar brand */
.brand{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.brand svg{width:46px;height:46px;flex:0 0 46px}
.brand h1{margin:0}
.ptext{font-size:12px;font-weight:700;letter-spacing:.04em;margin:-10px 0 14px;opacity:.85}
/* step header */
.stephead{display:flex;gap:16px;align-items:center;margin:0 0 6px}
.stepnum{flex:0 0 58px;height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;line-height:1;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(0,0,0,.15)}
.stepnum small{font-size:9px;font-weight:700;letter-spacing:.08em;opacity:.9;margin-bottom:3px}
.stephead h2{margin:2px 0 0}
.grouptag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
/* hero */
.hero{border-radius:22px;padding:30px 32px;color:#fff;display:grid;grid-template-columns:1fr 210px;gap:20px;align-items:center;margin-bottom:8px;position:relative;overflow:hidden}
.hero h2{color:#fff;font-size:30px;margin:6px 0 10px}
.hero p{margin:0;opacity:.92;font-size:16.5px}
.hero .kicker{font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero svg{width:100%;height:auto}
.lvcard{position:relative;border-radius:16px;transition:transform .1s, box-shadow .15s}
.lvcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}
.lvcard .stars{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;opacity:.85}
.lvcard.basis .stars{color:var(--basis)} .lvcard.standard .stars{color:var(--standard)} .lvcard.experte .stars{color:var(--experte)}
.finish{border-radius:18px;padding:18px 22px;color:#fff;display:flex;gap:16px;align-items:center;margin:10px 0 16px}
.finish .big{font-size:38px;line-height:1}
.finish b{font-size:18px;display:block}
@media (max-width:860px){.hero{grid-template-columns:1fr}.hero svg{max-width:180px}}

/* ---------- WRITE (Schreibwerkstatt / Überarbeiten) ---------- */
body.theme-write{--accent:#2b5aa8;--accent2:#5b8bd6;--accent-soft:#e8eff9;--standard:#2b5aa8;--standard-soft:#e8eff9;
  background:#f5f3ee}
.theme-write .side{background:#1f3a66;color:#fff;border-right:0}
.theme-write .side .sub,.theme-write .side .small,.theme-write .nav .grp{color:#b9c9e4}
.theme-write .side .small button{color:#ffe2a8}
.theme-write .nav button{color:#fff}
.theme-write .nav button:hover{background:rgba(255,255,255,.1)}
.theme-write .nav button.cur{background:#fff;color:#1f3a66}
.theme-write .nav .dot{border-color:rgba(255,255,255,.45);color:#fff}
.theme-write .nav button.cur .dot{border-color:#2b5aa8;color:#2b5aa8}
.theme-write .nav .done .dot{background:#e8b04a;border-color:#e8b04a;color:#1f3a66}
.theme-write .progress{background:rgba(255,255,255,.2)}
.theme-write .progress span{background:#e8b04a}
.theme-write .ptext{color:#dfe7f4;font-weight:600}
.theme-write .menu-toggle{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.theme-write .hero{background:linear-gradient(135deg,#1f3a66 0%,#2b5aa8 100%)}
.theme-write .finish{background:#1f3a66}
.theme-write .muster-text{background:#fffdf6;border:1px solid #efe4c8;border-left:4px solid #e8b04a}

/* ---------- PHONE (Handyverbot) ---------- */
body.theme-phone{--accent:#0e8a8c;--accent2:#ff7a59;--accent-soft:#e3f4f4;--standard:#0e8a8c;--standard-soft:#e3f4f4;
  background:#eef5f6 linear-gradient(180deg,#e4f1f2,#f4f7f9 400px)}
.theme-phone .side{background:linear-gradient(180deg,#0e6f78 0%,#1d4f73 100%);color:#fff;border-right:0}
.theme-phone .side .sub,.theme-phone .side .small,.theme-phone .nav .grp{color:#bfe3e6}
.theme-phone .side .small button{color:#ffd0c2}
.theme-phone .nav button{color:#fff;border-radius:14px}
.theme-phone .nav button:hover{background:rgba(255,255,255,.12)}
.theme-phone .nav button.cur{background:#fff;color:#0e6f78}
.theme-phone .nav .dot{border-color:rgba(255,255,255,.5);color:#fff}
.theme-phone .nav button.cur .dot{border-color:#0e8a8c;color:#0e8a8c}
.theme-phone .nav .done .dot{background:#ff7a59;border-color:#ff7a59;color:#fff}
.theme-phone .progress{background:rgba(255,255,255,.18);height:16px;border-radius:5px;border:2px solid rgba(255,255,255,.85);position:relative;overflow:visible;margin-right:8px}
.theme-phone .progress::after{content:"";position:absolute;right:-7px;top:3px;width:4px;height:6px;background:rgba(255,255,255,.85);border-radius:0 2px 2px 0}
.theme-phone .progress span{background:linear-gradient(90deg,#7ee0a1,#3cc47a);border-radius:2px;margin:1px;height:calc(100% - 2px)}
.theme-phone .ptext{color:#fff}
.theme-phone .menu-toggle{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.theme-phone .hero{background:linear-gradient(135deg,#0e8a8c 0%,#1d4f73 70%,#2c3e74 100%)}
.theme-phone .finish{background:linear-gradient(135deg,#0e8a8c,#ff7a59)}
.theme-phone .stepnum{border-radius:18px}
.theme-phone .card{border-radius:20px}
.theme-phone .chip{background:#e3f4f4;border-color:#bfe3e3;border-radius:16px 16px 16px 4px} .theme-phone .chip:hover{background:#d1eded}
.theme-phone .muster-text{border-radius:16px 16px 16px 4px}
.theme-phone .textbtn{background:linear-gradient(135deg,#ff7a59,#f2603c);border-color:#f2603c}
.theme-phone .drawer header{background:#0e6f78;color:#fff}
.theme-phone .drawer header .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
@media print{body.theme-write,body.theme-phone{background:#fff}}
.lvcard{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}

      {type:"builder", id:"b_these", target:"these", title:"Argument-Baukasten", intro:"Fülle die vier Bausteine für Argument 1 aus und setze sie zusammen. Danach überschreibst du die Felder für Argument 2.", fields:ARG_FIELDS, levels:["basis","standard"]},
      {type:"write", id:"these", task:true, label:"Mein Block zur Autorenmeinung", rows:14,

      {type:"lvbox", lv:"experte", tag:"Profi-Auftrag", html:"<p>Verwende in einem Argument ein <b>eigenes</b> Beispiel aus deinem Schulalltag, das über den Text hinausgeht – und zeige, an welcher Stelle Bergers Argumentation dadurch ergänzt wird.</p>", levels:["experte"]},

    lead:"Überleitung, <b>Gegenthese</b> und zwei Gegenargumente. Baue mindestens einmal <b>Kritik am Text</b> ein.",
    blocks:[
      {type:"check", id:"c_gegen", title:"Checkliste Gegenmeinung", items:["Überleitung zur Gegenposition („Zweifelsohne … Dennoch …“)","klare <b>Gegenthese</b>","<b>ein bis zwei</b> Gegenargumente, das stärkste zuletzt","jedes Argument: <b>Behauptung, Begründung, Beispiel/Beleg, Rückführung</b>","mindestens einmal <b>Kritik an einer Textstelle</b> (mit Zeilenangabe)","objektiv formuliert, ohne Ich-Form"]},
      planInfo(["k1","k2"],"Gegenthese: Dennoch spricht einiges dafür, dass ein Handyverbot sinnvoll sein kann."),
      {type:"help", kind:"formul", title:"Formulierungshilfen", html:chips(["Zweifelsohne sprechen also einige Argumente für Bergers Position. Dennoch darf nicht vergessen werden, dass ein Handyverbot an Schulen durchaus sinnvoll sein kann.","Zu bedenken ist allerdings, dass","Das Argument … ist zwar nachvollziehbar, jedoch","Die Aussage …, blendet aus, dass","Wer behauptet, dass …, lässt außer Acht, dass","Die Autorin räumt dieses Problem zwar ein (vgl. Z. …), blendet aber aus, dass","Das schwerwiegendste Argument ist jedoch, dass","Deshalb spricht einiges dafür,"]), chipsFor:"gegen", openFor:["basis","standard"], levels:["basis","standard"]},
      {type:"builder", id:"b_gegen", target:"gegen", title:"Argument-Baukasten (Gegenargument)", fields:GEG_FIELDS, levels:["basis","standard"]},
      {type:"write", id:"gegen", task:true, label:"Mein Block zur Gegenmeinung", rows:14,
        starters:{basis:"Zweifelsohne sprechen also einige Argumente für Bergers Position. Dennoch darf nicht vergessen werden, dass ein Handyverbot an Schulen durchaus sinnvoll sein kann.\n\n"}},
      {type:"lvbox", lv:"experte", tag:"Profi-Auftrag", html:"<p>Berger schlägt „Handygaragen“ und Regeln vor (Z. 42–48). Prüfe kritisch: Sind diese Regeln im Schulalltag wirklich umsetzbar? Baue deine Einschätzung als Textkritik in ein Gegenargument ein.</p>", levels:["experte"]},

    blocks:[
      {type:"custom", render:(S)=>{ const $=window.$el; const p=S.v.plan&&S.v.plan.pos; const t={zu:"Zustimmung: Ein generelles Verbot ist der falsche Weg.",ab:"Ablehnung: Ein Verbot ist richtig.",bed:"bedingte Zustimmung: kein generelles Verbot, aber klare Regeln."}[p];
        return $("div",{class:"lvbox standard",html:`<div class="tag">Dein geplantes Ergebnis</div><p style="margin:4px 0">${t||"– noch nicht gewählt (Schritt „Schreibplan“) –"}</p>`}); }},
      {type:"check", id:"c_syn", title:"Checkliste Synthese", items:["Ich wäge beide Seiten ab.","Ich beziehe eindeutig Stellung (Ja, Nein oder bedingt).","Ich nenne Bedingungen.","Ich bringe <b>keine neuen Argumente</b>.","Ich schreibe ohne Ich-Form.","Ich runde mit einem Gedanken ab."]},
      {type:"help", kind:"tipp", title:"Hilfe: objektiv statt Ich-Form", html:OBJ, openFor:["basis","standard"]},
      {type:"help", kind:"formul", title:"Formulierungshilfen", html:chips(["Wägt man die Argumente gegeneinander ab, so zeigt sich, dass","Die Gefahr … ist zwar ernst zu nehmen, doch","Die Frage, ob Smartphones an Schulen generell verboten werden sollten, lässt sich daher mit","beantworten","– allerdings nur, wenn","Wünschenswert wäre es, dass"]), chipsFor:"syn", openFor:["basis"], levels:["basis","standard"]},
      {type:"write", id:"syn", task:true, label:"Meine Synthese", rows:7,
        starters:{basis:"Wägt man die Argumente gegeneinander ab, so zeigt sich, dass … Die Gefahr … ist zwar ernst zu nehmen, doch … Die Frage, ob Smartphones an Schulen generell verboten werden sollten, lässt sich daher mit … beantworten – allerdings nur, wenn … Wünschenswert wäre es, dass …"}},
      {type:"lvbox", lv:"experte", tag:"Profi-Auftrag", html:"<p>Formuliere eine Bedingung, unter der sich dein Urteil ändern würde („Sollte sich zeigen, dass …, müsste man …“).</p>", levels:["experte"]},
      {type:"help", kind:"loesung", title:"Musteraufsatz: Synthese", html:sol(L.syn)}]},

  /* 13 */ {group:"Abschluss", nav:"Mein Aufsatz & Überarbeitung", title:"Mein Aufsatz – fertig zum Überarbeiten",
    lead:"Hier steht dein ganzer Aufsatz. Prüfe ihn mit der Checkliste und dem Sprach-Check und verbessere die einzelnen Schritte, wenn nötig.",
    blocks:[
      {type:"check", id:"c_end", title:"Checkliste für die Überarbeitung", items:[
        "Einleitung endet mit einer klaren Themenfrage.",
        "Überleitung nennt Autorin, Titel, Textsorte, Jahr und These.",

      {type:"help", kind:"loesung", title:"Zum Vergleich: der vollständige Musteraufsatz", html:"<p>Vergleiche erst, wenn dein eigener Aufsatz fertig ist.</p>"+FULL}]}

</script><script>/* Gemeinsamer Kern: Schritte, Niveaus, Speichern, Sprach-Check, Export */
(function(){
const P = window.PAGE;
const LV = {basis:"Basis", standard:"Standard", experte:"Experte"};
let S = {level:null, name:"", v:{}, c:{}, step:0, seen:{}};
try{ const r = localStorage.getItem(P.key); if(r){ S = Object.assign(S, JSON.parse(r)); } }catch(e){}
function save(){ try{ localStorage.setItem(P.key, JSON.stringify(S)); }catch(e){} }
window.STATE = S; window.SAVE = save;

const $ = (t, a={}, ...kids) => { const e = document.createElement(t);
  for(const k in a){ if(k==="class") e.className=a[k]; else if(k==="html") e.innerHTML=a[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), a[k]); else e.setAttribute(k,a[k]); }
  kids.flat().forEach(c => { if(c==null) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e; };
window.$el = $;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
window.esc = esc;
const vis = b => !b.levels || (S.level && b.levels.includes(S.level));

/* ---------- Sprach-Check ---------- */
function stripQuotes(t){ return t.replace(/„[^“]*“/g, m => " ".repeat(m.length)); }
function langCheck(text, opts={}){
  const out = []; const t = text || "";
  if(!t.trim()) return {cls:"warn", html:"Hier steht noch kein Text."};
  const nq = stripQuotes(t);
  const ich = [...nq.matchAll(/\b(ich|mich|mir|meine?[nmrs]?|meiner|wir|uns|unsere?[nmrs]?)\b/gi)].map(m=>m[0]);
  if(ich.length) out.push(`<b>Ich-/Wir-Form gefunden</b> (${[...new Set(ich.map(w=>w.toLowerCase()))].join(", ")}): Schreibe objektiv, z.&nbsp;B. „Wägt man … ab, so zeigt sich …“ oder „Es spricht dafür, dass …“.`);
  const ugs = [...nq.matchAll(/\b(krass|voll|halt|mega|echt|cool|okay|ok|eh|zocken|kriegen|kriegt|total|irgendwie|Sachen?)\b/gi)].map(m=>m[0]);
  if(ugs.length) out.push(`<b>Umgangssprache?</b> (${[...new Set(ugs.map(w=>w.toLowerCase()))].join(", ")}): Ersetze durch sachliche Wörter.`);
  const past = [...nq.matchAll(/\b(war|waren|hatte|hatten|sagte|schrieb|meinte|erklärte|zeigte|wurde|wurden|ging|kam)\b/gi)].map(m=>m[0]);
  if(past.length) out.push(`<b>Präteritum?</b> (${[...new Set(past.map(w=>w.toLowerCase()))].join(", ")}): Inhaltsangabe und Erörterung stehen im <b>Präsens</b>.`);
  const quotes = [...t.matchAll(/„[^“]{3,}“(?!\s*\((Z\.|vgl\.))/g)].length;
  if(quotes && !opts.noQuoteCheck) out.push(`<b>${quotes} Zitat(e) ohne Zeilenangabe:</b> Setze nach jedem Zitat (Z. …) bzw. bei sinngemäßer Wiedergabe (vgl. Z. …).`);
  const sents = (t.match(/[^.!?]+[.!?]*/g)||[]).filter(s => s.trim().split(/\s+/).length > 35);
  if(sents.length) out.push(`<b>${sents.length} sehr lange(r) Satz/Sätze</b> (über 35 Wörter): Teile sie auf, damit dein Text verständlich bleibt.`);
  if(opts.indirect){
    const ind = (t.match(/\b(sei|seien|habe|hätten|könne|müsse|solle|gebe|gehöre|werde|dürfe)\b/g)||[]).length;
    if(ind===0) out.push(`<b>Keine indirekte Rede gefunden:</b> Gib die Aussagen der Autorin im Konjunktiv&nbsp;I wieder (sie <i>sei</i>, <i>habe</i>, <i>müsse</i> …).`);
  }
  if(!out.length) return {cls:"ok", html:"Super, der Sprach-Check hat nichts gefunden. Prüfe trotzdem selbst noch einmal Rechtschreibung und Zeichensetzung."};
  return {cls:"warn", html:"<ul><li>"+out.join("</li><li>")+"</li></ul><small>Der Check ist eine Hilfe, kein Urteil – er findet nicht alles und irrt sich manchmal.</small>"};
}
window.langCheck = langCheck;
const words = t => (t||"").trim() ? t.trim().split(/\s+/).length : 0;

/* ---------- Block-Renderer ---------- */
const R = {};
R.info = b => $("div",{class:"card"+(b.task?" task":""), html:(b.title?`<h3>${b.title}</h3>`:"")+b.html});
R.lvbox = b => $("div",{class:"lvbox "+b.lv, html:`<div class="tag">${b.tag||("Für "+LV[b.lv])}</div>`+b.html});
R.help = b => { const d=$("details",{class:"help "+(b.kind||"tipp")});
  if(b.open===true || (b.openFor && b.openFor.includes(S.level))) d.open=true;
  d.append($("summary",{}, b.title), $("div",{class:"body", html:b.html}));
  if(b.chipsFor){ d.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", ()=>insertInto(b.chipsFor, ch.dataset.t || ch.textContent))); }
  return d; };
R.check = b => { const arr = S.c[b.id] || (S.c[b.id] = b.items.map(()=>false));
  const box=$("div",{class:"card checklist"}); if(b.title) box.append($("h3",{},b.title)); if(b.intro) box.append($("p",{html:b.intro}));
  const cnt=$("div",{class:"count"}); const upd=()=>{cnt.textContent=`${arr.filter(Boolean).length} von ${b.items.length} abgehakt`;};
  b.items.forEach((it,i)=>{ const cb=$("input",{type:"checkbox"}); cb.checked=!!arr[i];
    cb.addEventListener("change",()=>{arr[i]=cb.checked; save(); upd();});
    box.append($("label",{},cb,$("span",{html:it}))); });
  upd(); box.append(cnt); return box; };
function insertInto(id, txt){ const ta=document.getElementById("ta-"+id); if(!ta) return;
  const s=(ta.selectionStart!=null)?ta.selectionStart:ta.value.length; const se=(ta.selectionEnd!=null)?ta.selectionEnd:s; const before=ta.value.slice(0,s), after=ta.value.slice(se);
  const pad = before && !/\s$/.test(before) ? " " : "";
  ta.value = before + pad + txt + after; ta.focus(); const p=(before+pad+txt).length; ta.setSelectionRange(p,p);
  S.v[id]=ta.value; save(); ta.dispatchEvent(new Event("input")); }
window.insertInto = insertInto;
R.write = b => { const box=$("div",{class:"card write"+(b.task?" task":"")});
  box.append($("label",{class:"lbl", for:"ta-"+b.id, html:b.label}));
  if(b.hint) box.append($("p",{class:"hint", html:b.hint, style:"font-size:14.5px;color:var(--muted);margin:0 0 6px"}));
  const ta=$("textarea",{id:"ta-"+b.id, placeholder:b.placeholder||"Schreibe hier …"});
  if(b.rows) ta.style.minHeight=(b.rows*26)+"px";
  ta.value = S.v[b.id] || ""; const wc=$("span",{class:"wc"});
  const upd=()=>{wc.textContent=words(ta.value)+" Wörter";}; ta.addEventListener("input",()=>{S.v[b.id]=ta.value; save(); upd();}); upd();
  box.append(ta); const row=$("div",{class:"row"});
  const st = typeof b.starters==="string" ? ((!b.starterLevels || b.starterLevels.includes(S.level)) ? b.starters : null) : (b.starters ? b.starters[S.level] : null);
  if(st){
    row.append($("button",{class:"btn ghost small", onclick:()=>{ if(ta.value.trim() && !confirm("Satzanfänge unten an deinen Text anhängen?")) return;
      ta.value = (ta.value.trim()? ta.value.trim()+"\n\n":"") + st; S.v[b.id]=ta.value; save(); upd(); ta.focus(); }}, "Satzanfänge einfügen"));
  }
  if(b.copyFrom){ row.append($("button",{class:"btn ghost small", onclick:()=>{ const src=S.v[b.copyFrom]||""; if(!src.trim()){alert("Im vorherigen Feld steht noch nichts.");return;}
      if(ta.value.trim() && !confirm("Dein bisheriger Text in diesem Feld wird ersetzt. Fortfahren?")) return; ta.value=src; S.v[b.id]=src; save(); upd(); }}, b.copyLabel||"Alten Text übernehmen")); }
  const res=$("div");
  if(b.check!==false){ row.append($("button",{class:"btn small", onclick:()=>{ const r=langCheck(ta.value,{indirect:b.indirect, noQuoteCheck:b.noQuoteCheck}); res.className="result "+r.cls; res.innerHTML=r.html; }}, "Sprach-Check")); }
  row.append(wc); box.append(row, res); return box; };
R.builder = b => { const box=$("div",{class:"card"+(b.task?" task":"")}); box.append($("h3",{html:b.title}));
  if(b.intro) box.append($("p",{html:b.intro}));
  const g=$("div",{class:"builder"});
  b.fields.forEach((f,i)=>{ const id=b.id+"_"+i; const ta=$("textarea",{placeholder:f.ph||""}); ta.value=S.v[id]||"";
    ta.addEventListener("input",()=>{S.v[id]=ta.value; save();});
    g.append($("div",{class:"bf"}, $("label",{}, $("span",{class:"num"}, String(i+1)), f.label), f.hint?$("div",{class:"hint",html:f.hint}):null, ta)); });
  box.append(g);
  box.append($("div",{class:"row"}, $("button",{class:"btn", onclick:()=>{
    const parts=b.fields.map((f,i)=>(S.v[b.id+"_"+i]||"").trim()).filter(Boolean);
    if(parts.length<b.fields.length){ if(!confirm("Noch nicht alle Bausteine sind ausgefüllt. Trotzdem zusammensetzen?")) return; }
    const para=parts.map(p=>/[.!?“]$/.test(p)?p:p+".").join(" ");
    const cur=(S.v[b.target]||"").trim(); S.v[b.target]=(cur?cur+"\n\n":"")+para; save(); render();
    setTimeout(()=>{const ta=document.getElementById("ta-"+b.target); if(ta){ta.scrollIntoView({behavior:"smooth",block:"center"}); ta.focus();}},50);
  }}, b.btn||"Zu einem Absatz zusammensetzen ↓")));
  return box; };
R.mc = b => { const box=$("div",{class:"card mc task"}); box.append($("h3",{html:b.q}));
  const name="mc-"+b.id; const res=$("div");
  b.options.forEach((o,i)=>{ const r=$("input",{type:"radio",name}); if(S.v[b.id]===i) r.checked=true;
    r.addEventListener("change",()=>{S.v[b.id]=i; save(); res.className=""; res.innerHTML="";}); box.append($("label",{},r,$("span",{html:o}))); });
  box.append($("div",{class:"row"},$("button",{class:"btn small", onclick:()=>{ const v=S.v[b.id];
    if(v==null){res.className="result warn"; res.innerHTML="Wähle zuerst eine Antwort."; return;}
    const ok=v===b.correct; res.className="result "+(ok?"ok":"bad"); res.innerHTML=(ok?"<b>Richtig!</b> ":"<b>Noch nicht.</b> ")+(ok?b.why:(b.whyWrong||"Lies die Textstelle noch einmal und versuche es erneut.")); }}, "Prüfen")), res);
  return box; };
R.custom = b => b.render(S, save, render);
R.final = b => { const wrap=$("div");
  const txt = b.parts.map(p=>({title:p.title, body:p.ids.map(id=>(S.v[id]||"").trim()).filter(Boolean).join("\n\n")}));
  const plain = (P.finalHeader?P.finalHeader(S)+"\n\n":"") + txt.map(p=>p.title.toUpperCase()+"\n"+(p.body||"[noch leer]")).join("\n\n");
  const prev=$("div",{class:"final-preview"});
  prev.innerHTML = (P.finalHeader?`<h4>${esc(P.finalHeader(S))}</h4>`:"") + txt.map(p=>`<h4>${esc(p.title)}</h4>`+(p.body?esc(p.body):'<span class="empty">noch leer – gehe zurück zu diesem Schritt</span>')).join("");
  const res=$("div");
  const total=txt.reduce((a,p)=>a+words(p.body),0);
  wrap.append($("div",{class:"row noprint"},
    $("button",{class:"btn", onclick:()=>{ const blob=new Blob([plain],{type:"text/plain;charset=utf-8"}); const a=$("a",{href:URL.createObjectURL(blob), download:(P.fileName||"Aufsatz")+".txt"}); document.body.append(a); a.click(); a.remove(); }}, "Als Textdatei speichern"),
    $("button",{class:"btn ghost", onclick:()=>window.print()}, "Drucken / als PDF"),
    $("button",{class:"btn ghost", onclick:()=>{ navigator.clipboard && navigator.clipboard.writeText(plain).then(()=>{res.className="result ok";res.innerHTML="Text kopiert – du kannst ihn jetzt z. B. in Word einfügen.";},()=>{res.className="result warn";res.innerHTML="Kopieren hat nicht geklappt. Markiere den Text unten und kopiere ihn mit Strg+C.";}); }}, "Kopieren"),
    $("button",{class:"btn ghost", onclick:()=>{ const r=langCheck(txt.map(p=>p.body).join("\n\n"),{}); res.className="result "+r.cls; res.innerHTML="<b>Sprach-Check für den ganzen Text:</b><br>"+r.html; }}, "Sprach-Check (ganzer Text)"),
    $("span",{class:"wc"}, total+" Wörter")), res, prev);
  return wrap; };

/* ---------- Startseite ---------- */
function renderStart(main){
  main.append($("div",{class:"hero", html:`<div><div class="kicker">${T.kicker||"Start"}</div><h2>${P.title}</h2><p>${P.intro}</p></div>${T.hero||""}`}));
  main.append($("h3",{style:"margin:22px 0 4px"},"Wähle dein Niveau"), $("p",{style:"margin:0;color:var(--muted);font-size:15px"},"Du kannst es später jederzeit links in der Leiste ändern."));
  const lv=$("div",{class:"levels"});
  const STARS={basis:"viele Hilfen",standard:"einige Hilfen",experte:"wenige Hilfen"};
  P.levels.forEach(l=>{ lv.append($("button",{class:"lvcard "+l.id+(S.level===l.id?" sel":""), onclick:()=>{S.level=l.id; save(); render();}}, $("span",{class:"stars"},STARS[l.id]), $("b",{},(T.levelNames&&T.levelNames[l.id])||l.name), $("span",{html:l.desc}))); });
  main.append(lv);
  if(P.startExtra) main.append($("div",{class:"card", html:P.startExtra}));
}

/* ---------- Layout ---------- */
const app=document.getElementById("app");
const T = P.theme || {}; if(T.id) document.body.classList.add("theme-"+T.id);
function render(){
  app.innerHTML="";
  const side=$("aside",{class:"side collapsed"});
  side.append($("button",{class:"btn ghost small menu-toggle", onclick:()=>side.classList.toggle("collapsed")},"☰ Schritte"));
  const brand=$("div",{class:"brand"}); if(T.icon) brand.append($("span",{html:T.icon}));
  brand.append($("div",{}, $("h1",{},P.short), $("div",{class:"sub",style:"margin:0"},P.sub))); side.append(brand);
  if(S.level) side.append($("span",{class:"levelpill lv-"+S.level},"Niveau: "+LV[S.level]));
  const pct=Math.round(100*S.step/(P.steps.length));
  const pr=$("div",{class:"progress"}); pr.append($("span",{style:`width:${Math.max(pct,3)}%`})); side.append(pr);
  side.append($("div",{class:"ptext"}, T.progress ? T.progress(pct) : pct+" %"));
  const ul=$("ul",{class:"nav"});
  ul.append($("li",{}, $("button",{class:S.step===0?"cur":"", onclick:()=>go(0)}, $("span",{class:"dot"},"★"), "Start")));
  let lastG=null;
  P.steps.forEach((st,i)=>{ if(st.group && st.group!==lastG){ ul.append($("li",{class:"grp"},st.group)); lastG=st.group; }
    const li=$("li",{class:S.seen[i+1]&&S.step!==i+1?"done":""});
    const b=$("button",{class:S.step===i+1?"cur":"", onclick:()=>go(i+1)}, $("span",{class:"dot"}, S.seen[i+1]?"✓":String(i+1)), st.nav||st.title);
    if(!S.level) b.disabled=true; li.append(b); ul.append(li); });
  side.append(ul);
  const sm=$("div",{class:"small"}); sm.append("Niveau ändern: ");
  P.levels.forEach((l,i)=>{ sm.append($("button",{onclick:()=>{S.level=l.id; save(); render();}}, l.name)); if(i<P.levels.length-1) sm.append(" · "); });
  sm.append($("br")); sm.append($("button",{onclick:()=>{ if(confirm("Wirklich alle Eingaben löschen und neu beginnen?")){ try{localStorage.removeItem(P.key);}catch(e){} location.reload(); } }}, "Alles löschen & neu beginnen"));
  sm.append($("div",{style:"margin-top:8px"},"Deine Eingaben werden automatisch in diesem Browser gespeichert."));
  side.append(sm);
  const main=$("main");
  if(S.step===0){ renderStart(main); }
  else { const st=P.steps[S.step-1];
    const head=$("div",{class:"stephead"});
    head.append($("div",{class:"stepnum", html:`<small>${T.stepWord||"SCHRITT"}</small>${S.step}`}), $("div",{}, $("span",{class:"grouptag"}, (st.group||"")+"  ·  "+S.step+" / "+P.steps.length), $("h2",{html:st.title})));
    main.append(head);
    if(S.step===P.steps.length && T.finish) main.append($("div",{class:"finish", html:T.finish}));
    if(st.lead) main.append($("p",{class:"lead", html:st.lead}));
    st.blocks.forEach(b=>{ if(vis(b)) main.append(R[b.type](b)); }); }
  const nav=$("div",{class:"stepnav noprint"});
  nav.append(S.step>0?$("button",{class:"btn ghost", onclick:()=>go(S.step-1)},"← Zurück"):$("span"));
  if(S.step<P.steps.length){ const nx=$("button",{class:"btn", onclick:()=>go(S.step+1)}, S.step===0?"Los geht's →":"Weiter →"); if(!S.level) {nx.disabled=true; nx.title="Wähle zuerst ein Niveau";} nav.append(nx); }
  main.append(nav);
  app.append(side, main);
  if(P.source) app.append(...sourceDrawer());
}
window.RENDER = render;
function go(i){ if(i>0 && !S.level) return; if(S.step>0) S.seen[S.step]=true; S.step=Math.max(0,Math.min(P.steps.length,i)); save(); render(); window.scrollTo(0,0); }

/* ---------- Quelltext-Schublade ---------- */
let drawerOpen=false;
function sourceDrawer(){
  const src=P.source; const d=$("div",{class:"drawer"+(drawerOpen?" open":"")});
  const body=$("div",{class:"src"}); body.append($("h4",{},src.title), $("div",{class:"meta", html:src.meta}));
  let n=0; src.paras.forEach(lines=>{ lines.forEach((l,j)=>{ n++; body.append($("div",{class:"ln"+(j===0&&n>1?" pstart":"")}, $("i",{}, (n%5===0||n===1)?String(n):""), $("span",{},l))); }); });
  d.append($("header",{}, $("b",{},src.label||"Text"), $("button",{class:"btn ghost small", onclick:()=>{drawerOpen=false; d.classList.remove("open");}},"Schließen ✕")), $("div",{class:"scroll"},body));
  const btn=$("button",{class:"btn textbtn noprint", onclick:()=>{drawerOpen=!drawerOpen; d.classList.toggle("open",drawerOpen);}}, "📄 "+(src.button||"Text anzeigen"));
  return [btn,d];
}
render();
})();
</script><script>window.__ok=true;</script></body></html>
